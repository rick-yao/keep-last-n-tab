name: Release CRX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release CRX
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate extension files
        run: |
          python3 -m json.tool manifest.json > /dev/null
          node --check background.js
          node --check options.js

      - name: Prepare extension directory
        run: |
          set -euo pipefail

          mkdir -p dist/extension dist/release
          cp manifest.json background.js options.html options.js dist/extension/
          cp -R icons dist/extension/

      - name: Pack CRX
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo "Chrome or Chromium was not found on the runner." >&2
            exit 1
          fi

          pack_args=("--pack-extension=$PWD/dist/extension")
          if [ -n "${CRX_PRIVATE_KEY_BASE64:-}" ]; then
            printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > dist/release/extension.pem
            chmod 600 dist/release/extension.pem
            pack_args+=("--pack-extension-key=$PWD/dist/release/extension.pem")
          else
            echo "::warning::CRX_PRIVATE_KEY_BASE64 is not set. Chrome will generate a temporary key, so the extension ID may change between releases."
          fi

          "$chrome_bin" "${pack_args[@]}"

          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          short_sha="${GITHUB_SHA::7}"
          crx_name="last-tab-keeper-${version}-${short_sha}.crx"

          mv dist/extension.crx "dist/release/$crx_name"
          ls -lh "dist/release/$crx_name"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          tag="build-${short_sha}"
          title="Last Tab Keeper ${version} (${short_sha})"
          crx_file="$(find dist/release -name '*.crx' -type f | head -n 1)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$crx_file" --clobber
          else
            gh release create "$tag" "$crx_file" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "Automated CRX release for commit $GITHUB_SHA."
          fi
