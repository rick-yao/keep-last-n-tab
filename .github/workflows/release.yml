name: Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate extension files
        run: |
          python3 -m json.tool manifest.json > /dev/null
          node --check background.js
          node --check options.js

      - name: Prepare extension directory
        run: |
          set -euo pipefail

          mkdir -p dist/extension dist/release
          cp manifest.json background.js options.html options.js dist/extension/
          cp -R icons dist/extension/

      - name: Apply release extension key
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${CRX_PRIVATE_KEY_BASE64:-}" ]; then
            echo "CRX_PRIVATE_KEY_BASE64 is required so release builds keep a stable extension ID." >&2
            exit 1
          fi

          printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > dist/release/extension.pem
          chmod 600 dist/release/extension.pem

          manifest_key="$(openssl rsa -in dist/release/extension.pem -pubout -outform DER 2>/dev/null | openssl base64 -A)"
          MANIFEST_KEY="$manifest_key" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("dist/extension/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["key"] = os.environ["MANIFEST_KEY"]
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          python3 -m json.tool dist/extension/manifest.json > /dev/null

      - name: Build unpacked zip
        run: |
          set -euo pipefail

          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          short_sha="${GITHUB_SHA::7}"
          zip_name="last-tab-keeper-${version}-${short_sha}.zip"

          (cd dist/extension && zip -qr "../release/$zip_name" .)
          ls -lh "dist/release/$zip_name"

      - name: Pack CRX
        run: |
          set -euo pipefail

          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo "Chrome or Chromium was not found on the runner." >&2
            exit 1
          fi

          "$chrome_bin" \
            "--pack-extension=$PWD/dist/extension" \
            "--pack-extension-key=$PWD/dist/release/extension.pem"

          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          short_sha="${GITHUB_SHA::7}"
          crx_name="last-tab-keeper-${version}-${short_sha}.crx"

          mv dist/extension.crx "dist/release/$crx_name"
          ls -lh "dist/release/$crx_name"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          tag="build-${short_sha}"
          title="Last Tab Keeper ${version} (${short_sha})"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/*.crx dist/release/*.zip --clobber
          else
            gh release create "$tag" dist/release/*.crx dist/release/*.zip \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "Automated extension release for commit $GITHUB_SHA. Use the zip file for Load unpacked installs; use the CRX file only when you specifically need a packaged extension."
          fi
